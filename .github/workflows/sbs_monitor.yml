name: Monitor Tasas SBS

on:
  schedule:
    - cron: '12,42 22,23 * * *'
    - cron: '12,42 0,1,2,3,4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-sbs:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar validación de tasas SBS
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
        run: python monitor_sbs.py

      - name: Actualizar estado de fechas enviadas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add estado.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: registrar fecha SBS enviada" && git push)
